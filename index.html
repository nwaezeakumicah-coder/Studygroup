let currentQuestion = 0;
let userAnswers = new Array(quiz.length).fill(null);
let timerSeconds = 3600; // 3600s = 1 hour

function updateTimer() {
  const minutes = Math.floor(timerSeconds/60).toString().padStart(2,'0');
  const seconds = (timerSeconds%60).toString().padStart(2,'0');
  document.getElementById('timer').innerText = `Time Remaining: ${minutes}:${seconds}`;
  if(timerSeconds<=0){
    submitQuiz();
  } else {
    timerSeconds--;
  }
}

setInterval(updateTimer,1000);

function loadQuestion(){
  const q = quiz[currentQuestion];
  document.getElementById("question").innerText = `Q${currentQuestion+1}: ${q.question}`;
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  q.options.forEach((option,index)=>{
    const btn = document.createElement("button");
    btn.innerText = option;
    btn.className = "option";
    if(userAnswers[currentQuestion]===index) btn.classList.add("selected");
    btn.onclick = ()=>{
      userAnswers[currentQuestion]=index;
      loadQuestion();
    };
    optionsDiv.appendChild(btn);
  });
}

function nextQuestion(){
  if(currentQuestion<quiz.length-1){
    currentQuestion++;
    loadQuestion();
  }
}

function prevQuestion(){
  if(currentQuestion>0){
    currentQuestion--;
    loadQuestion();
  }
}

function submitQuiz(){
  let score = 0;
  quiz.forEach((q,i)=>{
    if(userAnswers[i]===q.answer) score++;
  });

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = `<h2>Your Score: ${score} / ${quiz.length}</h2>`;

  quiz.forEach((q,i)=>{
    const userAns = userAnswers[i];
    const correctAns = q.answer;
    const userText = userAns!==null?q.options[userAns]:"Not answered";
    const correctText = q.options[correctAns];
    const div = document.createElement("div");
    div.className="review";
    div.innerHTML=`
      <p><b>Q${i+1}:</b> ${q.question}</p>
      <p>Your Answer: <span class="${userAns===correctAns?"correct":"wrong"}">${userText}</span></p>
      <p>Correct Answer: <span class="correct">${correctText}</span></p>
    `;
    resultDiv.appendChild(div);
  });

  saveLeaderboard(score);
}

function saveLeaderboard(score){
  const name = prompt("Enter your name for the leaderboard:","Student");
  if(!name) return;
  const leaderboard = JSON.parse(localStorage.getItem("leaderboard")||"[]");
  leaderboard.push({name:name,score:score,date:new Date().toLocaleString()});
  leaderboard.sort((a,b)=>b.score-a.score);
  if(leaderboard.length>10) leaderboard.pop();
  localStorage.setItem("leaderboard",JSON.stringify(leaderboard));
  displayLeaderboard();
}

function displayLeaderboard(){
  let leaderboard = JSON.parse(localStorage.getItem("leaderboard")||"[]");
  if(leaderboard.length===0) return;
  const resultDiv = document.getElementById("result");
  const div = document.createElement("div");
  div.innerHTML="<h3>Leaderboard (Top 10)</h3>";
  leaderboard.forEach((entry,i)=>{
    div.innerHTML+=`<p>${i+1}. ${entry.name} - ${entry.score} / ${quiz.length} (${entry.date})</p>`;
  });
  resultDiv.appendChild(div);
}
